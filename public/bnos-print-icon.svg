<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">BNOS Print App Icon</title>
  <defs>
    <linearGradient id="bg_grad" x1="120" y1="80" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="bitos_gold" x1="220" y1="360" x2="800" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7b506"/>
      <stop offset="0.52" stop-color="#f59f10"/>
      <stop offset="1" stop-color="#f28919"/>
    </linearGradient>
  </defs>

  <!-- App Icon Rounded Square -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#bg_grad)"/>

  <!-- Thermal Receipt -->
  <path d="M324 440 L324 176 C324 150 345 128 372 128 L652 128 C679 128 700 150 700 176 L700 440 Z"
        fill="#ffffff" stroke="#000000" stroke-width="34" stroke-linejoin="round"/>

  <!-- BitOS Gold Hexagon on Receipt -->
  <polygon points="512,188 564,218 564,278 512,308 460,278 460,218"
           fill="url(#bitos_gold)" stroke="#000000" stroke-width="18" stroke-linejoin="round"/>

  <!-- Receipt Lines -->
  <line x1="392" y1="358" x2="632" y2="358" stroke="#000000" stroke-width="24" stroke-linecap="round"/>
  <line x1="392" y1="410" x2="564" y2="410" stroke="#000000" stroke-width="24" stroke-linecap="round"/>

  <!-- Printer Body -->
  <rect x="164" y="424" width="696" height="404" rx="96"
        fill="url(#bitos_gold)" stroke="#000000" stroke-width="40" stroke-linejoin="round"/>

  <!-- Paper Slot -->
  <rect x="292" y="424" width="440" height="44" rx="22" fill="#000000"/>

  <!-- Front Panel -->
  <rect x="240" y="580" width="544" height="164" rx="52"
        fill="#ffffff" stroke="#000000" stroke-width="30" stroke-linejoin="round"/>
  <line x1="312" y1="662" x2="572" y2="662" stroke="#000000" stroke-width="28" stroke-linecap="round"/>
  <circle cx="692" cy="662" r="32" fill="#16a34a" stroke="#000000" stroke-width="16"/>
</svg>
