name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-linux:
    name: Test (Rust & Web SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Web SDK tests
        run: node --test packages/web-sdk/test/sdk.test.ts

      - name: Run Rust workspace tests
        run: cargo test --workspace

  test-macos:
    name: Typecheck (macOS & iOS Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run full check script
        run: ./scripts/check.sh
